name: Android APK

# Собирает приложения «Расчёты» и «Анализ свай» для планшетов Aquarius NS220 (Android 8.1).
# APK публикуются в Releases репозитория — их можно скачать прямо на планшет.
on:
  push:
    branches: [claude, android]
    paths:
      - 'android/**'
      - 'pile-analyzer.html'
      - 'webcad.html'
      - 'webcad/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Шрифты Golos Text и JetBrains Mono (офлайн)
        run: |
          mkdir -p /tmp/fonts android/build-web/fonts
          cd /tmp/fonts
          npm pack @fontsource/golos-text @fontsource/jetbrains-mono --silent
          for t in *.tgz; do tar -xzf "$t"; cp package/files/*-{cyrillic,latin}-{400,500,600}-normal.woff2 "$GITHUB_WORKSPACE/android/build-web/fonts/" 2>/dev/null || true; rm -rf package; done
          ls "$GITHUB_WORKSPACE/android/build-web/fonts"

      - name: Копирование веб-калькуляторов в assets
        run: python3 android/tools/sync_web.py

      - name: Ключ подписи
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Секрет ANDROID_KEYSTORE_B64 не задан — APK подписаны отладочным ключом, обновления поверх установленных версий не встанут"
          fi

      - name: Сборка
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android --no-daemon assembleRelease

      - name: Переименование APK
        run: |
          mkdir -p out
          cp android/raschety/build/outputs/apk/release/*.apk "out/Raschety-1.0.${{ github.run_number }}.apk"
          cp android/svai/build/outputs/apk/release/*.apk "out/Analiz-svai-1.0.${{ github.run_number }}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: out/*.apk

      - name: Публикация в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK сборка ${{ github.run_number }} (${{ github.ref_name }})
          body: |
            «Расчёты» и «Анализ свай» для планшетов на Android 8.1+.
            Установка: скачать APK на планшет → открыть → разрешить установку из этого источника.
          files: out/*.apk
          prerelease: ${{ github.ref_name != 'claude' }}
