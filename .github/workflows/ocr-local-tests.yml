name: Local OCR safety tests
on:
  push:
    branches: [ocr-local-test]
  pull_request:
    paths: ['razmetka/**', 'scripts/**', '.github/workflows/ocr-local-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r razmetka/requirements.txt
      - run: python -m unittest discover -s razmetka/tests -v
      - run: python razmetka/audit_checks.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python build-browser.py
      - run: node browser-tests.cjs
      - run: node browser-recovery-tests.cjs
      - run: node browser-queue-tests.cjs
      - run: node browser-cache-tests.cjs
      - run: node browser-names-tests.cjs
      - run: node browser-djvu-tests.cjs
      - run: node browser-layout-tests.cjs
      - run: node browser-safety-tests.cjs
      - run: node browser-cache-quality-tests.cjs
      - run: node browser-pdf-tests.cjs
