// Подпись релизных APK. Ключ один на все планшеты, иначе обновления не встанут поверх.
// Берётся из переменных окружения (в GitHub Actions — из секретов). Без них APK подписывается отладочным ключом.
def ks = System.getenv('KEYSTORE_FILE')
def hasKey = ks && file(ks).exists()
android {
    signingConfigs {
        if (hasKey) {
            release {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig hasKey ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
        }
    }
}
