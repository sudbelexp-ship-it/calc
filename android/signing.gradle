// Подпись релизных APK. Ключ один на все планшеты, иначе обновления не встанут поверх.
// Берётся из переменных окружения (в GitHub Actions — из секретов). Без них APK подписывается отладочным ключом.
android {
    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks && file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            } else {
                def dbg = signingConfigs.debug
                storeFile dbg.storeFile; storePassword dbg.storePassword
                keyAlias dbg.keyAlias; keyPassword dbg.keyPassword
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
    }
}
